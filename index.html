<!DOCTYPE html>

<title>C&C</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f4f4;
}

header{
    background:#000;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#333;
    text-align:center;
    padding:10px;
}

nav button{
    background:#ff69b4;
    color:white;
    border:none;
    padding:10px 15px;
    margin:5px;
    border-radius:5px;
    cursor:pointer;
}

.banner{
    background:#ffe4ec;
    text-align:center;
    padding:60px 20px;
}

.products{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
}

.product{
    width:280px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.product img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.product-content{
    padding:15px;
}

.price{
    font-size:24px;
    font-weight:bold;
    color:red;
}

.buy-btn{
    background:#ff69b4;
    color:white;
    padding:10px;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}

details{
    margin-top:10px;
}

details summary{
    list-style:none;
}

details summary::-webkit-details-marker{
    display:none;
}

footer{
    text-align:center;
    background:#000;
    color:white;
    padding:20px;
    margin-top:30px;
}

a{
    color:#ff69b4;
    text-decoration:none;
}
</style>

</head>
